version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: crawler-redis
    ports:
      - "6379:6379"
    restart: always

  storage_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: storage_service
    container_name: crawler-storage
    environment:
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    depends_on:
      - redis
    restart: on-failure
