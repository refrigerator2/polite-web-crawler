[package]
name = "crawler-worker"
version = "0.1.0"
edition = "2024"
[dependencies]
prost = "0.14.4"
tonic-prost = "0.14.6"
common = { path = "../common/" }
scraper = "0.27.0"
serde_json = "1.0.151"
sqlx = "0.9.0"
reqwest = { version = "0.13", features = [
  "json",
  "blocking",
  "stream",
  "gzip",
] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
url = "2.5.8"
thiserror = "2.0"
texting_robots = "0.2.2"
anyhow = "1.0.103"
dashmap = "6.2.1"
fastbloom = "0.17.0"
quick-xml = "0.41.0"
wiremock = "0.6.5"
simhash = "0.3.0"
redis = { version = "1.5.0", features = [
  "aio",
  "connection-manager",
  "tokio-comp",
] }
uuid = "1.24.0"
serde = { version = "1.0.229", features = ["rc"] }
tonic = "0.14.6"
dotenvy = "0.15.7"
tokio-util = "0.7.19"
[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"
protobuf-src = "2.1.1+27.1"
[dev-dependencies]
protoc-bin-vendored = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis"] }
tokio-stream = { version = "0.1", features = ["net"] }
