[package]
name = "crawler-storage"
version = "0.1.0"
edition = "2024"
[dependencies]
serde = "1.0.229"
redis = { version = "1.5.0", features = [
  "aio",
  "connection-manager",
  "tokio-comp",
] }
fastbloom = "0.17.0"
sqlx = { version = "0.9.0", features = [
  "sqlite",
  "runtime-tokio",
  "tls-rustls",
] }
common = { path = "../common/" }
simhash = "0.3.0"
url = "2.5.8"
texting_robots = "0.2.2"
tokio = { version = "1", features = ["full"] }
moka = { version = "0.12.15", features = ["future"] }
