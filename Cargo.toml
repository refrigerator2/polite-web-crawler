[package]
name = "crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
scraper = "0.27.0"
sqlx = { version = "0.9.0", features = [
  "sqlite",
  "runtime-tokio",
  "tls-rustls",
] }
reqwest = { version = "0.13", features = ["json", "blocking", "stream"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
url = "2.5.8"
thiserror = "2.0"
texting_robots = "0.2.2"
anyhow = "1.0.103"
dashmap = "6.2.1"
fastbloom = "0.17.0"
